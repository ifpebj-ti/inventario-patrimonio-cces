apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Do log para o trace correspondente (campo traceId escrito pelo backend).
      derivedFields:
        - name: traceId
          # O log do Spring Boot traz o trace entre colchetes: [<traceId com 32 hex>-<spanId com 16 hex>]
          matcherRegex: '\[(\w{32})-\w{16}\]'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
