# Equivalente de desenvolvimento do snippets/login-rate-limited.conf de producao: o 429 que o proprio
# Nginx gera no /auth/login precisa de CORS e Retry-After, senao o navegador esconde a resposta e o
# frontend mostra "servico indisponivel". A unica diferenca para producao e a origem do frontend
# (http://localhost:3000, a mesma do CORS_ALLOWED_ORIGINS de desenvolvimento). Se mudar a
# FRONTEND_PORT, ajuste aqui.
default_type text/plain;
add_header Retry-After "6" always;
add_header Access-Control-Allow-Origin "http://localhost:3000" always;
add_header Access-Control-Expose-Headers "Retry-After" always;
add_header Vary "Origin" always;
return 429 "Too many attempts";
