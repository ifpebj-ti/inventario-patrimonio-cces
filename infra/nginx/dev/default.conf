# Nginx do ambiente de desenvolvimento (docker-compose.yml): reproduz, em HTTP simples, o freio por
# IP do login que o Nginx de producao faz (infra/nginx/app-vm/sites-tls/21-api.conf). Mantenha os
# mesmos valores das zonas e a mesma estrutura dos locations. O navegador fala com este Nginx na porta
# NGINX_PORT (padrao 8081) e ele repassa para o backend; o 8080 do backend continua publicado para
# curl e debug, mas esse caminho nao passa por aqui.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:1m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # Login por senha: freio por IP (o backend limita por usuario). So o /auth/login: o /auth/google
    # e o /auth/me ficam na zona geral (location / abaixo).
    location = /auth/login {
        limit_req zone=auth burst=10 nodelay;
        error_page 429 = @login_rate_limited;
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://inventarium-back:8080;
    }

    # 429 gerado pelo Nginx no login, com Retry-After e CORS.
    location @login_rate_limited {
        include /etc/nginx/inventarium/snippets/login-rate-limited.conf;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://inventarium-back:8080;
    }
}
