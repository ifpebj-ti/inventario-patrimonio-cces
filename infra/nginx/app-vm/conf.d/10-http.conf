# Porta 80: desafio ACME (HTTP-01) do Let's Encrypt e redirecionamento para HTTPS.
# Hosts desconhecidos (varredura por IP, Host forjado) caem no default_server e sao descartados.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name inventariumifpe.me
                www.inventariumifpe.me
                api.inventariumifpe.me
                portainer.inventariumifpe.me
                sonar.inventariumifpe.me
                grafana.inventariumifpe.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
