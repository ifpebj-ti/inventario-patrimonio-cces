# Contexto http: valores globais de endurecimento, logs sem dados sensiveis e zonas de rate limit.
server_tokens off;

# Logs sem Authorization, cookies nem query string ($uri, e nao $request, descarta a query).
log_format redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time host=$host';
access_log /var/log/nginx/access.log redacted;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Esquema que o backend deve enxergar. Na 9080 (HTTP simples vindo do LB, que ja terminou o TLS) o
# cliente falou HTTPS; nas demais portas vale o esquema real da conexao. Vem da porta, e nao de um
# cabecalho, porque o cliente nao consegue forjar a porta em que o LB o atendeu.
map $server_port $forwarded_proto {
    9080    https;
    default $scheme;
}

# Login por senha: o backend limita por usuario (5 falhas em 15 min); esta zona limita por IP, so no
# /auth/login, e freia a varredura antes de chegar na JVM.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook:1m rate=6r/m;
# Grafana publico: login (POST /login) por IP e uso geral, mais folgado porque cada tela dispara
# dezenas de requisicoes.
limit_req_zone $binary_remote_addr zone=grafana_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=grafana:10m rate=30r/s;
limit_req_status 429;

client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 30s;
client_max_body_size 1m;

# Gerado na VM por install-nginx-config.sh (IP privado da VM de observabilidade).
include /etc/nginx/inventarium/generated/upstreams.conf;

# Gerado na VM por install-nginx-config.sh. Com LB_CIDR, confia no X-Forwarded-For so quando a conexao
# vem do LB e passa a usar o IP real do cliente em $remote_addr (rate limit, allowlist do Portainer e
# log). Sem LB_CIDR o arquivo fica sem diretivas e o Nginx continua usando o IP da conexao.
include /etc/nginx/inventarium/generated/real-ip.conf;
