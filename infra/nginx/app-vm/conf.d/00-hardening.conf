# Contexto http: valores globais de endurecimento, logs sem dados sensiveis e zonas de rate limit.
server_tokens off;

# Logs sem Authorization, cookies nem query string ($uri, e nao $request, descarta a query).
log_format redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time host=$host';
access_log /var/log/nginx/access.log redacted;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Login: o backend ja limita por usuario/IP; esta zona freia a varredura antes de chegar na JVM.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook:1m rate=6r/m;
limit_req_status 429;

client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 30s;
client_max_body_size 1m;

# Gerado na VM por install-nginx-config.sh (IP privado da VM de observabilidade).
include /etc/nginx/inventarium/generated/upstreams.conf;
