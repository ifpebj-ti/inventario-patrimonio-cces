# Frontend (Next.js em 127.0.0.1:3000). Este arquivo so e instalado depois que o certificado existe.

# Qualquer SNI/Host que nao seja nosso e descartado, em vez de cair no frontend.
server {
    listen 443 ssl http2 default_server;
    server_name _;
    include /etc/nginx/inventarium/snippets/tls.conf;
    return 444;
}

server {
    listen 443 ssl http2;
    server_name www.inventariumifpe.me;
    include /etc/nginx/inventarium/snippets/tls.conf;
    include /etc/nginx/inventarium/snippets/headers-common.conf;

    return 301 https://inventariumifpe.me$request_uri;
}

server {
    listen 443 ssl http2;
    server_name inventariumifpe.me;
    include /etc/nginx/inventarium/snippets/tls.conf;
    include /etc/nginx/inventarium/snippets/headers-common.conf;
    include /etc/nginx/inventarium/snippets/headers-front.conf;

    # Arquivos com hash no nome: cache longo no navegador.
    location /_next/static/ {
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
