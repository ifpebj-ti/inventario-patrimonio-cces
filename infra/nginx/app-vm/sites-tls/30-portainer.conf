# Portainer (HTTPS autoassinado em 127.0.0.1:9443). A UI so abre para os IPs de admin; apenas o
# webhook de redeploy da stack fica publico, porque o GitHub Actions o chama pela internet.
server {
    listen 443 ssl http2;
    server_name portainer.inventariumifpe.me;
    include /etc/nginx/inventarium/snippets/tls.conf;
    include /etc/nginx/inventarium/snippets/headers-common.conf;

    # allow <IP de admin>; deny all;  (gerado na VM a partir de allowed_admin_cidrs)
    include /etc/nginx/inventarium/generated/admin-allowlist.conf;

    # O UUID do webhook funciona como segredo. Somente POST, com rate limit.
    location ~ "^/api/stacks/webhooks/[0-9a-fA-F-]{36}$" {
        allow all;
        limit_except POST {
            deny all;
        }
        limit_req zone=webhook burst=3 nodelay;
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_verify off;
        proxy_read_timeout 300s;
    }

    location / {
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass https://127.0.0.1:9443;
        # Certificado autoassinado do proprio Portainer, em loopback.
        proxy_ssl_verify off;
        proxy_read_timeout 300s;
    }
}
