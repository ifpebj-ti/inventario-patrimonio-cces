# Portas internas para o Load Balancer da OCI (ADR 0009). O LB termina o TLS e fala HTTP simples com o
# Nginx na 9080 (os vhosts de 20-* a 32-* escutam nela, ao lado da 443) e confere a saude na 9081.
# Ambas so aceitam o NSG do LB (Terraform), a regra de firewall do host (install-nginx-config.sh) e,
# no health, a allowlist abaixo. O acesso direto pela 443 continua funcionando (rollback).
# Este arquivo so e instalado depois que o certificado existe, junto com os demais vhosts.

# Host desconhecido na 9080 (varredura, Host forjado) e descartado, como na 80 e na 443.
server {
    listen 9080 default_server;
    server_name _;
    return 444;
}

# Health check do LB: independe de Host/SNI (o default_server da 443 devolveria 444) e de qualquer
# upstream, entao so diz se o proprio Nginx esta de pe.
server {
    listen 9081;
    server_name _;
    access_log off;

    # allow <LB_CIDR>; deny all;  (gerado na VM a partir de LB_CIDR; sem LB_CIDR, so "deny all")
    include /etc/nginx/inventarium/generated/lb-allowlist.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
