# API (Spring Boot em 127.0.0.1:8080) em api.inventariumifpe.me. Mesmo "site" do frontend
# (inventariumifpe.me), porem outra origem: o CORS do backend (CORS_ALLOWED_ORIGINS) autoriza o front.
server {
    listen 443 ssl http2;
    server_name api.inventariumifpe.me;
    include /etc/nginx/inventarium/snippets/tls.conf;
    include /etc/nginx/inventarium/snippets/headers-common.conf;
    include /etc/nginx/inventarium/snippets/headers-api.conf;

    # Limite de upload de planilhas: o Spring ja recusa acima do seu proprio limite.
    client_max_body_size 5m;

    # O Nginx e a fonte unica dos headers de seguranca; descarta os que o Spring Security repete.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cache-Control;

    # So o health check e publico. A regex vence o prefixo /actuator/ abaixo.
    location ~ ^/actuator/health(/(liveness|readiness))?$ {
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location /actuator/ {
        return 404;
    }

    # Login: freio extra por IP antes de chegar na aplicacao.
    location /auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }
}
