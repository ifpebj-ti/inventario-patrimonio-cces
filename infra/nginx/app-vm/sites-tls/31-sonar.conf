# SonarQube na VM privada de observabilidade. Publico porque o scanner do GitHub Actions precisa
# alcancar; o acesso e protegido pelo login obrigatorio do Sonar (sonar.forceAuthentication=true).
server {
    listen 443 ssl http2;
    server_name sonar.inventariumifpe.me;
    include /etc/nginx/inventarium/snippets/tls.conf;
    include /etc/nginx/inventarium/snippets/headers-common.conf;

    # Relatorios do scanner podem ser grandes.
    client_max_body_size 50m;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;

    location / {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://sonar_upstream;
        proxy_read_timeout 120s;
    }
}
