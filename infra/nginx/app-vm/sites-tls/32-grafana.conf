# Grafana na VM privada de observabilidade. Somente IPs de admin.
server {
    listen 443 ssl http2;
    server_name grafana.inventariumifpe.me;
    include /etc/nginx/inventarium/snippets/tls.conf;
    include /etc/nginx/inventarium/snippets/headers-common.conf;

    include /etc/nginx/inventarium/generated/admin-allowlist.conf;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;

    location / {
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://grafana_upstream;
    }
}
