# Grafana na VM privada de observabilidade. Publico (ambiente de homologacao, aceito pelo professor);
# o acesso e protegido pelo login obrigatorio do Grafana (acesso anonimo, cadastro e dashboards
# publicos desligados em docker-compose.observability.yml) e por rate limit por IP aqui.
server {
    listen 443 ssl http2;
    server_name grafana.inventariumifpe.me;
    include /etc/nginx/inventarium/snippets/tls.conf;
    include /etc/nginx/inventarium/snippets/headers-common.conf;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;

    # Tentativas de login por IP (o Grafana ainda bloqueia o usuario apos falhas seguidas).
    location = /login {
        limit_req zone=grafana_login burst=5 nodelay;
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://grafana_upstream;
    }

    # Uma tela de dashboard dispara dezenas de requisicoes (assets e consultas), por isso a zona geral
    # do Grafana e mais folgada que a da API.
    location / {
        limit_req zone=grafana burst=100 nodelay;
        include /etc/nginx/inventarium/snippets/proxy.conf;
        proxy_pass http://grafana_upstream;
    }
}
