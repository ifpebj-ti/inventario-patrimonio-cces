# Configuracao principal do Nginx da VM da aplicacao. Substitui o nginx.conf de fabrica do pacote,
# que traz um server padrao na porta 80 e conflitaria com o 10-http.conf.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    # Maior que o idle timeout do listener do LB (Terraform, 330 s): se o Nginx fechasse a conexao antes,
    # o LB poderia reutilizar uma conexao ja encerrada e devolver 502.
    keepalive_timeout 350s;
    types_hash_max_size 4096;

    include /etc/nginx/conf.d/*.conf;
}
