# Resposta do 429 que o proprio Nginx gera no freio por IP do /auth/login (zona auth). O 429 do
# backend (bloqueio por usuario) passa direto e ja traz CORS e Retry-After pelo Spring; este e o
# equivalente para quando a requisicao nem chega na aplicacao. Sem o CORS o navegador esconde a
# resposta e o frontend mostraria "servico indisponivel" em vez de "muitas tentativas".
# O Retry-After e o tempo para o bucket da zona (10r/m) ganhar uma vaga de novo.
default_type text/plain;
add_header Retry-After "6" always;
add_header Access-Control-Allow-Origin "https://inventariumifpe.me" always;
add_header Access-Control-Expose-Headers "Retry-After" always;
add_header Vary "Origin" always;
return 429 "Too many attempts";
