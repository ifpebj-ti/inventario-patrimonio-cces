# Headers exclusivos do frontend (Next.js + Login com Google + leitor de QR pela camera).
#
# CSP em modo Report-Only na primeira semana: o navegador so registra violacoes no console, sem
# bloquear. Depois de validar login Google, leitor de QR, exportacoes e upload, troque o nome do
# header abaixo para "Content-Security-Policy" e rode infra/scripts/deploy-nginx.sh.
#
# 'unsafe-inline' em script-src e necessario hoje por causa dos scripts inline de hidratacao do
# Next.js; usar nonce exige middleware no frontend (issue de acompanhamento).
#   Google Identity Services: script, frame, connect e style de https://accounts.google.com/gsi/
#   Leitor de QR: media-src/worker-src blob:
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://api.inventariumifpe.me https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# Camera apenas para o proprio site (leitor de QR); o restante bloqueado.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# O popup do Login com Google precisa conseguir falar com a janela que o abriu.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
