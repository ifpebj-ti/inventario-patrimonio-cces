# Headers de seguranca de TODO server HTTPS. Inclua este arquivo no nivel do server (nao em location:
# um add_header dentro de location descarta os herdados). Quem define um add_header proprio em
# location precisa repetir este include.
#
# HSTS: comece com max-age curto e so suba depois de validar todos os subdominios em HTTPS. Para
# producao estavel troque por: max-age=31536000; includeSubDomains
# Nao adicione "preload" sem decisao explicita: remover um dominio da lista de preload e demorado.
add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
