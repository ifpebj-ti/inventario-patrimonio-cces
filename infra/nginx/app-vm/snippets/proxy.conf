# Cabecalhos do proxy reverso. O X-Forwarded-For e SOBRESCRITO com o IP de quem conectou (nunca
# concatenado): o backend usa FORWARD_HEADERS_STRATEGY=native para o rate limit de login por IP, e
# um cabecalho vindo do cliente permitiria burlar o limite.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# proxy_read_timeout e proxy_send_timeout ficam no padrao do Nginx (60s); vhosts que precisam de mais
# (Portainer, Sonar) definem o proprio valor depois deste include.
proxy_connect_timeout 5s;
