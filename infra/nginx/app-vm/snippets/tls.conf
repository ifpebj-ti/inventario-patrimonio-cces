# TLS: perfil "intermediate" da Mozilla (TLS 1.2 e 1.3) e sem tickets de sessao.
#
# Sem OCSP stapling de proposito: a Let's Encrypt encerrou o OCSP em 2025 (os certificados novos nao
# trazem mais o endereco do respondedor), entao `ssl_stapling` nao teria efeito e so geraria avisos.
ssl_certificate     /etc/letsencrypt/live/inventariumifpe.me/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/inventariumifpe.me/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
