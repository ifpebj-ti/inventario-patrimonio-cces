services:
  postgres:
    container_name: inventarium-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_management}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-inventory_management}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventarium-net

  inventarium-back:
    container_name: inventarium-back
    image: ${BACKEND_IMAGE:-inventarium-back:local}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/inventory_management}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-admin}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-admin}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-inventariumclp@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SECURITY_TOKEN_SECRET: ${SECURITY_TOKEN_SECRET:?defina SECURITY_TOKEN_SECRET no .env}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-ifpe.edu.br}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:-admin}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
    networks:
      - inventarium-net

  # Reproduz o Nginx de producao (freio por IP do login). O navegador usa este servico na porta
  # NGINX_PORT; o backend continua publicado em BACKEND_PORT para curl e debug, mas esse caminho nao
  # passa pelo limite de IP. Config em infra/nginx/dev.
  nginx:
    container_name: inventarium-nginx
    image: nginx:1.26-alpine
    restart: unless-stopped
    depends_on:
      inventarium-back:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./infra/nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/app-vm/snippets/proxy.conf:/etc/nginx/inventarium/snippets/proxy.conf:ro
      - ./infra/nginx/dev/login-rate-limited.conf:/etc/nginx/inventarium/snippets/login-rate-limited.conf:ro
    networks:
      - inventarium-net

  inventarium-front:
    container_name: inventarium-front
    image: ${FRONTEND_IMAGE:-inventarium-front:local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?defina GOOGLE_OAUTH_CLIENT_ID no .env}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${NGINX_PORT:-8081}}
    restart: unless-stopped
    depends_on:
      inventarium-back:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - inventarium-net

networks:
  inventarium-net:
    driver: bridge

volumes:
  postgres-data:
