services:
  postgres:
    container_name: inventarium-postgres
    image: postgres:15
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=inventory_management

    volumes:
      - ./config/data/postgres:/var/lib/postgresql/data

      # Descomentar a linha abaixo caso deseje modificar algum parâmetro de configuração do PostgreSQL.
      # Usar como referência o arquivo presente dentro da imagem, no caminho /etc/postgresql/postgresql.conf.
      #- ./postgresql.conf:/etc/postgresql/postgresql.conf

    networks:
      - inventarium-net

  inventarium-back:
    container_name: inventarium-back
    image: "inventarium-back:0.0.1"
    depends_on:
      - postgres
    ports:
      - '8080:8080'

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inventory_management
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-inventariumclp@gmail.com}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-change-me-to-a-long-random-secret}
      - SECURITY_TOKEN_SECRET=${SECURITY_TOKEN_SECRET:?defina SECURITY_TOKEN_SECRET no .env}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_ALLOWED_DOMAINS=${GOOGLE_ALLOWED_DOMAINS:-ifpe.edu.br}

    networks:
      - inventarium-net

  inventarium-front:
    container_name: inventarium-front
    image: "inventarium-front:0.0.1"
    build:
      context: ./frontend
      args:
        # Mesmo client id do backend: o GoogleTokenProvider valida o claim "aud"
        # contra a cópia dele, e divergência vira um 401 impossível de depurar
        # pela tela. O client id é público, vai no bundle do browser.
        # O Next inlina no build, então trocar o valor exige rebuild da imagem.
        # Sem :? de propósito: com ele qualquer comando do compose (down, ps)
        # falharia enquanto a variável estivesse vazia. Quem barra o build sem
        # client id é a guarda no next.config.ts, com mensagem explícita.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    depends_on:
      - inventarium-back
    ports:
      - '3000:3000'

    networks:
      - inventarium-net

networks:
  inventarium-net:
    driver: bridge