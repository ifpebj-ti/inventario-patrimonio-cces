spring.application.name=inventory

# O padrão do Spring Boot busca um changelog .yaml; como o deste projeto é .xml, o caminho precisa ser explícito.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/inventory_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME:inventariumclp@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
# A porta 465 já usa SSL implícito, por isso o STARTTLS fica desabilitado.
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.transport.protocol=smtp

# Sem default: a aplicação recusa subir sem a variável, em vez de assinar JWT com um segredo público.
security.token.secret=${SECURITY_TOKEN_SECRET}

# Origens (separadas por vírgula) que o navegador pode usar para chamar a API. "*" é recusado na
# inicialização. Em produção: https://inventariumifpe.me
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
# Vazio libera qualquer domínio. Cada entrada casa com o domínio e seus subdomínios.
google.oauth.allowed-domains=${GOOGLE_ALLOWED_DOMAINS:ifpe.edu.br}

# Conta de sistema (login por usuário e senha, sem Google). Sem default na senha: vazio desliga o
# login por senha. O identificador de login é gravado na coluna email do usuário.
system.admin.username=${SYSTEM_ADMIN_USERNAME:admin}
system.admin.password=${SYSTEM_ADMIN_PASSWORD:}

# Limite de tentativas do login por senha, por usuário (bloqueio temporário, contador em memória):
# estourar o limite de falhas na janela bloqueia o usuário pelo tempo de bloqueio (429 + Retry-After).
# O limite por IP é do Nginx (zona auth, só no /auth/login), que enxerga o IP real do cliente.
auth.login.user-max-failures=${AUTH_LOGIN_USER_MAX_FAILURES:5}
auth.login.window=${AUTH_LOGIN_WINDOW:15m}
auth.login.block-duration=${AUTH_LOGIN_BLOCK_DURATION:15m}

# Atrás do Nginx (produção) use `native`, para o backend enxergar o IP, o esquema e o host reais do
# cliente; o Nginx precisa SOBRESCREVER o X-Forwarded-For. Sem proxy confiável deixe `none`: o
# cabeçalho viria do cliente e seria falsificável. O limitador de login não depende disto.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# O Jackson 3 (Boot 4) recusa campo primitivo ausente no corpo (ex.: o `long id` do SectorDto, que o
# cliente não envia ao criar). Mantém o comportamento do Boot 3: ausente vira 0/false.
spring.jackson.deserialization.fail-on-null-for-primitives=false
# O Jackson 3 ordena as chaves alfabeticamente por padrão; mantém a ordem de declaração do Boot 3.
spring.jackson.mapper.sort-properties-alphabetically=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
