# spring.application.name=inventory
# Define o nome da sua aplica��o Spring. Este nome � usado internamente pelo Spring
# e pode aparecer em logs ou ferramentas de monitoramento.
spring.application.name=inventory

# --- Configura��es do Liquibase ---
# Caminho do changelog raiz. O padr�o do Spring Boot busca um arquivo .yaml;
# como o changelog deste projeto � .xml, o caminho precisa ser expl�cito.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# --- Configura��es do Banco de Dados ---
# Define a URL de conex�o com o banco de dados PostgreSQL.
# jdbc:postgresql://: Indica que � um driver JDBC para PostgreSQL.
# localhost:5433: O host e a porta onde o servidor PostgreSQL est� rodando.
# /inventory_management: O nome do banco de dados ao qual a aplica��o ir� se conectar.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/inventory_management}
# Define o nome de usu�rio para autentica��o no banco de dados.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
# Define a senha para autentica��o no banco de dados.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# --- Configura��es de E-mail (SMTP) ---
# Define o host (servidor) SMTP para envio de e-mails. Neste caso, � o servidor SMTP do Gmail.
spring.mail.host=smtp.gmail.com
# Define a porta do servidor SMTP. A porta 465 � comumente usada para SMTPS (SMTP sobre SSL/TLS).
spring.mail.port=465
# Define o nome de usu�rio (endere�o de e-mail) para autentica��o no servidor SMTP do Gmail.
spring.mail.username=${SPRING_MAIL_USERNAME:inventariumclp@gmail.com}
# Define a senha (ou senha de aplicativo, se a autentica��o de dois fatores estiver habilitada) para o e-mail.
# � importante que esta senha seja tratada com seguran�a e n�o exposta em ambientes de produ��o.
spring.mail.password=${SPRING_MAIL_PASSWORD}
# Habilita a autentica��o no servidor SMTP.
spring.mail.properties.mail.smtp.auth=true
# Desabilita o STARTTLS. Isso faz sentido se a conex�o j� estiver sendo feita sobre SSL/TLS
# na porta 465 (como indicado por spring.mail.properties.mail.smtp.ssl.enable=true).
spring.mail.properties.mail.smtp.starttls.enable=false
# Habilita explicitamente o uso de SSL/TLS para a conex�o SMTP.
spring.mail.properties.mail.smtp.ssl.enable=true
# Define o protocolo de transporte de e-mail como SMTP.
spring.mail.properties.mail.transport.protocol=smtp

# --- Configura��es de Seguran�a (Token JWT) ---
# Define a chave secreta usada para assinar e verificar tokens JWT (JSON Web Tokens).
# � CR�TICO que esta chave seja MUITO forte e n�o seja exposta em um ambiente de produ��o.
# Em produ��o, ela deve ser uma vari�vel de ambiente ou gerenciada de forma segura.
security.token.secret=${SECURITY_TOKEN_SECRET:dev-only-change-me}
