plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'clp'
version = '0.0.1-SNAPSHOT'

// Patches de segurança acima do que o Boot 4.1.1 gerencia. Cada pin sai quando o Boot passar a
// gerenciar uma versão corrigida.
// Tomcat 11.0.24 -> 11.0.26: CVE-2026-65182, CVE-2026-65905 e CVE-2026-68525.
ext['tomcat.version'] = '11.0.26'
// Jackson 3 (Boot gerencia 3.1.5): CVE-2026-68497, CVE-2026-89407, CVE-2026-89425,
// CVE-2026-91776 e CVE-2026-91777.
ext['jackson-bom.version'] = '3.1.7'
// Jackson 2 (Boot gerencia 2.21.5; ainda usado pelo java-jwt): mesmos CVEs, corrigidos na 2.21.7.
ext['jackson-2-bom.version'] = '2.21.7'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation "org.springframework.boot:spring-boot-starter-security"
    // https://mvnrepository.com/artifact/com.auth0/java-jwt
    implementation("com.auth0:java-jwt:4.6.1")

    // Leitura de arquivos Excel (xlxs e xlsx)
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // Lib usada para gerar Qr Code
    implementation("com.google.zxing:core:3.5.4")
    implementation("com.google.zxing:javase:3.5.4")

    // Dependência para gerar PDF
    implementation 'com.github.librepdf:openpdf:1.3.43'

    // Enviar emails
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Validação do ID token do Google (assinatura via JWKS + iss/aud/exp)
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // Versionamento e migração do schema do banco de dados. No Boot 4 a auto-configuração do
    // Liquibase vem do starter; só o liquibase-core não dispara a migração.
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql:42.7.13'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // No Boot 4 o TestRestTemplate saiu do starter-test e vive neste módulo.
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Teste de ponta a ponta do login com Google: Postgres real via container.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
    }
}
