name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Sync docs to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_DIR: ${{ runner.temp }}/inventario-patrimonio-cces.wiki
        run: |
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/ifpebj-ti/inventario-patrimonio-cces.wiki.git" \
            "${WIKI_DIR}"

          test "$(git -C "${WIKI_DIR}" remote get-url origin)" = \
            "https://x-access-token:${GH_TOKEN}@github.com/ifpebj-ti/inventario-patrimonio-cces.wiki.git"

      - name: Sync wiki files
        env:
          WIKI_DIR: ${{ runner.temp }}/inventario-patrimonio-cces.wiki
        run: |
          rsync -av --delete --exclude='.git/' docs/wiki/ "${WIKI_DIR}/"

      - name: Commit and push wiki changes
        env:
          WIKI_DIR: ${{ runner.temp }}/inventario-patrimonio-cces.wiki
        run: |
          git -C "${WIKI_DIR}" config user.name "github-actions[bot]"
          git -C "${WIKI_DIR}" config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git -C "${WIKI_DIR}" status --porcelain)" ]; then
            echo "No wiki changes to publish."
            exit 0
          fi

          git -C "${WIKI_DIR}" add .
          git -C "${WIKI_DIR}" commit -m "docs: sync wiki"
          git -C "${WIKI_DIR}" push origin HEAD:master
