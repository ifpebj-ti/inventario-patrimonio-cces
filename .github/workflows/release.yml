name: Release

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish release from merged PR
    if: github.event.pull_request.merged == true && (github.event.pull_request.head.ref == 'development' || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare release metadata
        id: prepare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node .github/scripts/release/prepare-release.js

      - name: Create release tag
        if: steps.prepare.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists."
          else
            git tag -a "${TAG}" -m "Release ${TAG}" -m "release-pr:${PR_NUMBER}"
            git push origin "${TAG}"
          fi

      - name: Upload release notes
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ steps.prepare.outputs.release_notes_path }}
          retention-days: 1
          if-no-files-found: error

  build-production-images:
    name: Build production images
    needs: release
    if: needs.release.outputs.skip != 'true'
    uses: ./.github/workflows/build-container-images.yml
    with:
      deployment_environment: production
      checkout_ref: ${{ needs.release.outputs.tag }}
      version_tag: ${{ needs.release.outputs.tag }}
      publish_images: true
      publish_latest_dev: false
      force_build_all: true
      frontend_api_url: ${{ vars.NEXT_PUBLIC_API_URL_PROD }}
      frontend_google_client_id: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || vars.GOOGLE_OAUTH_CLIENT_ID }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - release
      - build-production-images
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Resolve release notes path
        id: notes
        shell: bash
        run: |
          release_notes_path="$(find "${RUNNER_TEMP}/release-notes" -type f -name 'release-notes-*.md' | head -n 1)"

          if [ -z "${release_notes_path}" ]; then
            echo "Release notes artifact not found."
            exit 1
          fi

          echo "path=${release_notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: node .github/scripts/release/publish-github-release.js
