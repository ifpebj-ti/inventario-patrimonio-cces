name: Security scans

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scans-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine security scan scope
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.scope.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect security-relevant changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          images=false

          if echo "${changed_files}" | grep -Eq '^(frontend/|backend/|docker-compose\.yml|\.env\.example|\.github/workflows/(build-container-images|security-scans)\.yml)'; then
            images=true
          fi

          {
            echo "images=${images}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Escopo dos scans de segurança"
            echo ""
            echo "| Scan | Executar |"
            echo "| --- | --- |"
            echo "| Mudancas em codigo de imagem (o job de imagens sempre roda e se autolimita) | ${images} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  semgrep:
    name: Semgrep SAST
    # Sem `if:` de proposito: o check e obrigatorio no ruleset da main e um job pulado nunca reporta status.
    # O scan leva cerca de 1 minuto, entao roda em todo PR.
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        run: >-
          semgrep scan
          --config p/default
          --metrics off
          --error
          --sarif
          --output semgrep-report.sarif
          backend/src frontend/src .github

      - name: Upload Semgrep SARIF to Code Scanning
        if: always() && hashFiles('semgrep-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: semgrep-report.sarif
          category: semgrep

      - name: Upload Semgrep report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-report
          path: semgrep-report.sarif
          retention-days: 14
          if-no-files-found: error

  container-images:
    name: Trivy container and dependency scans
    needs: changes
    # Sem `if:` de proposito. O workflow reutilizavel ja decide sozinho se ha imagem para buildar e,
    # sem mudancas de frontend/backend, so imprime "No frontend/backend image sources changed" e passa.
    # Com o `if:` aqui, PRs que so mexem em infra/ ou docs/ nunca reportavam o check obrigatorio
    # "Trivy container and dependency scans / Container images" e ficavam bloqueados para sempre.
    uses: ./.github/workflows/build-container-images.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      publish_images: false
      frontend_api_url: ${{ vars.NEXT_PUBLIC_API_URL }}
      frontend_google_client_id: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || vars.GOOGLE_OAUTH_CLIENT_ID }}
