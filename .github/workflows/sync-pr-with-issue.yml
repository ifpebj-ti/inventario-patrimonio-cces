name: Sync PR with Issue

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  sync:
    name: Copy linked issue description
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/github/sync-pr-with-issue.js
