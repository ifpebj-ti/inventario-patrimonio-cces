name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Determine validation scope
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect frontend and backend changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          frontend=false
          backend=false

          if echo "${changed_files}" | grep -Eq '^(frontend/|package(-lock)?\.json|\.github/workflows/quality\.yml)'; then
            frontend=true
          fi

          if echo "${changed_files}" | grep -Eq '^(backend/|\.github/workflows/quality\.yml)'; then
            backend=true
          fi

          {
            echo "frontend=${frontend}"
            echo "backend=${backend}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Escopo das validações de qualidade"
            echo ""
            echo "| Área | Executar validação pesada |"
            echo "| --- | --- |"
            echo "| Frontend | ${frontend} |"
            echo "| Backend | ${backend} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run Secretlint
        run: npm run secretlint

  frontend-lint:
    name: Frontend lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: npm run lint

      - name: Report ESLint result
        if: steps.eslint.outcome == 'failure'
        run: |
          echo "::warning::O ESLint encontrou problemas. O check é informativo temporariamente e não bloqueia este pull request."

  frontend-tests:
    name: Frontend spreadsheet tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test form validations
        run: npm run test:unit

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test spreadsheet workflow
        run: npm run test:e2e

      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-spreadsheet-traces
          path: frontend/.next/test-results
          retention-days: 14
          if-no-files-found: warn

  backend-quality:
    name: Backend format and tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Java formatting
        id: spotless
        continue-on-error: true
        run: ./gradlew spotlessCheck --no-daemon --console=plain

      - name: Report formatting result
        if: steps.spotless.outcome == 'failure'
        run: |
          echo "::warning::O Spotless encontrou problemas de formatação. O check é informativo temporariamente e não bloqueia este pull request."

      # Gate de cobertura: falha se a cobertura de linhas ficar abaixo de 80% (backend/build.gradle).
      - name: Run backend tests and coverage gate
        run: ./gradlew test jacocoTestCoverageVerification --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 14
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco/test
          retention-days: 14
          if-no-files-found: warn

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Validate PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose
