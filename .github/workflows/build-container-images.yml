name: Build container images

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref, SHA, or tag to build.
        required: true
        type: string
      version_tag:
        description: Immutable application version tag for production images.
        required: false
        default: ""
        type: string
      publish_images:
        description: Push scanned images to GHCR.
        required: false
        default: false
        type: boolean
      force_build_all:
        description: Build both application images regardless of changed files.
        required: false
        default: false
        type: boolean
      frontend_api_url:
        description: NEXT_PUBLIC_API_URL build argument for the frontend image.
        required: false
        default: ""
        type: string
      frontend_google_client_id:
        description: NEXT_PUBLIC_GOOGLE_CLIENT_ID build argument for the frontend image.
        required: false
        default: ""
        type: string
    secrets:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID:
        description: Optional fallback for the frontend Google OAuth client ID.
        required: false
      GOOGLE_OAUTH_CLIENT_ID:
        description: Optional fallback for the frontend Google OAuth client ID.
        required: false

jobs:
  container-images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0

      - name: Detect image changes
        id: changes
        shell: bash
        env:
          FORCE_BUILD_ALL: ${{ inputs.force_build_all }}
          VERSION_TAG: ${{ inputs.version_tag }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_frontend=false
          build_backend=false
          changed_files=""

          if [ "${FORCE_BUILD_ALL}" = "true" ] || [ -n "${VERSION_TAG}" ]; then
            build_frontend=true
            build_backend=true
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            build_frontend=true
            build_backend=true
          else
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              # The change comparison needs the complete history of the base
              # branch. Fetching only its tip leaves no common ancestor when
              # the PR branch is behind main.
              git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
              changed_files="$(git diff --name-only "origin/${BASE_REF}"...HEAD)"
            elif [ -n "${BEFORE_SHA}" ] && ! [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
              if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                changed_files="$(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")"
              else
                echo "Previous commit ${BEFORE_SHA} is unavailable. Building all images."
                build_frontend=true
                build_backend=true
              fi
            else
              changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            fi

            echo "Changed files:"
            echo "${changed_files:-none}"

            if echo "${changed_files}" | grep -Eq '^(frontend/|docker-compose\.yml|\.env\.example|\.github/workflows/(build-container-images|security-scans)\.yml)'; then
              build_frontend=true
            fi

            if echo "${changed_files}" | grep -Eq '^(backend/|docker-compose\.yml|\.env\.example|\.github/workflows/(build-container-images|security-scans)\.yml)'; then
              build_backend=true
            fi
          fi

          {
            echo "frontend=${build_frontend}"
            echo "backend=${build_backend}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Container images"
            echo ""
            echo "| Service | Build |"
            echo "| --- | --- |"
            echo "| Frontend | ${build_frontend} |"
            echo "| Backend | ${build_backend} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Skip unchanged images
        if: steps.changes.outputs.frontend != 'true' && steps.changes.outputs.backend != 'true'
        run: echo "No frontend/backend image sources changed."

      - name: Run Trivy secret scan
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        id: trivy_secrets
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          format: sarif
          output: trivy-secrets.sarif

      - name: Run Trivy dependency scan for frontend
        if: steps.changes.outputs.frontend == 'true'
        id: trivy_frontend_dependencies
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: sarif
          output: trivy-frontend-dependencies.sarif

      - name: Run Trivy dependency scan for backend
        if: steps.changes.outputs.backend == 'true'
        id: trivy_backend_dependencies
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: sarif
          output: trivy-backend-dependencies.sarif

      - name: Set up Docker Buildx
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Resolve image metadata
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        id: meta
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY,,}"
          owner="${repository%%/*}"
          commit_sha="$(git rev-parse HEAD)"

          build_tags() {
            local image="$1"
            local tags_file="$2"
            local local_tag="$3"

            : > "${tags_file}"

            if [ -n "${VERSION_TAG}" ]; then
              printf "%s\n" "${image}:${VERSION_TAG}" >> "${tags_file}"
            else
              printf "%s\n" "${local_tag}" >> "${tags_file}"
            fi
          }

          frontend_image="ghcr.io/${owner}/inventarium-front"
          backend_image="ghcr.io/${owner}/inventarium-back"
          frontend_tags_file="${RUNNER_TEMP}/frontend-tags.txt"
          backend_tags_file="${RUNNER_TEMP}/backend-tags.txt"

          build_tags "${frontend_image}" "${frontend_tags_file}" "inventarium-front:ci"
          build_tags "${backend_image}" "${backend_tags_file}" "inventarium-back:ci"

          {
            echo "frontend_image=${frontend_image}"
            echo "backend_image=${backend_image}"
            echo "frontend_primary_tag=$(head -n 1 "${frontend_tags_file}")"
            echo "backend_primary_tag=$(head -n 1 "${backend_tags_file}")"
            echo "source_url=https://github.com/${GITHUB_REPOSITORY}"
            echo "revision=${commit_sha}"
            echo "frontend_tags<<EOF"
            cat "${frontend_tags_file}"
            echo "EOF"
            echo "backend_tags<<EOF"
            cat "${backend_tags_file}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate frontend build arguments
        if: steps.changes.outputs.frontend == 'true'
        shell: bash
        env:
          FRONTEND_API_URL: ${{ inputs.frontend_api_url || vars.NEXT_PUBLIC_API_URL }}
          FRONTEND_GOOGLE_CLIENT_ID: ${{ inputs.frontend_google_client_id || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || vars.GOOGLE_OAUTH_CLIENT_ID || secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if [ -z "${FRONTEND_API_URL}" ]; then
            echo "Missing frontend_api_url. Configure NEXT_PUBLIC_API_URL as a repository variable."
            exit 1
          fi

          if [ -z "${FRONTEND_GOOGLE_CLIENT_ID}" ]; then
            echo "Missing frontend_google_client_id. Configure NEXT_PUBLIC_GOOGLE_CLIENT_ID or GOOGLE_OAUTH_CLIENT_ID as a repository variable or secret."
            exit 1
          fi

      - name: Build frontend image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.frontend_tags }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ inputs.frontend_google_client_id || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || vars.GOOGLE_OAUTH_CLIENT_ID || secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
            NEXT_PUBLIC_API_URL=${{ inputs.frontend_api_url || vars.NEXT_PUBLIC_API_URL }}
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.source_url }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ inputs.version_tag }}

      - name: Scan frontend image
        if: steps.changes.outputs.frontend == 'true'
        id: trivy_frontend_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.frontend_primary_tag }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: sarif
          output: trivy-frontend-image.sarif

      - name: Build backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.backend_tags }}
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.source_url }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ inputs.version_tag }}

      - name: Scan backend image
        if: steps.changes.outputs.backend == 'true'
        id: trivy_backend_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.backend_primary_tag }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: sarif
          output: trivy-backend-image.sarif

      - name: Summarize Trivy findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          reports=(trivy-*.sarif)
          found_report=false

          {
            echo "## Achados do Trivy"
            echo ""

            for report in "${reports[@]}"; do
              if [ ! -f "${report}" ]; then
                continue
              fi

              found_report=true
              finding_count="$(jq '[.runs[]?.results[]?] | length' "${report}")"
              echo "### ${report} — ${finding_count} achado(s)"

              if [ "${finding_count}" -eq 0 ]; then
                echo "Nenhum achado com a severidade configurada."
                echo ""
                continue
              fi

              echo "| Regra/CVE | Nível | Mensagem | Localização | Linha |"
              echo "| --- | --- | --- | --- | --- |"
              jq -r '
                def clean: tostring | gsub("[\\r\\n|]"; " ");
                [.runs[]?.results[]?]
                | .[:20]
                | .[]
                | "| \((.ruleId // "regra-desconhecida") | clean) | \((.level // "desconhecido") | clean) | \((.message.text // "Sem mensagem") | clean) | \(([.locations[]?.physicalLocation.artifactLocation.uri // empty] | first // "sem-localizacao") | clean) | \(([.locations[]?.physicalLocation.region.startLine // empty] | first // "") | clean) |"
              ' "${report}"
              echo ""
            done

            if [ "${found_report}" = false ]; then
              echo "Nenhum relatório SARIF foi produzido nesta execução."
            else
              echo "São exibidos no máximo 20 achados por relatório. Consulte o artifact **trivy-reports** ou a aba Security para o resultado completo."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Trivy report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-reports
          path: trivy-*.sarif
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Trivy secret report to Code Scanning
        if: always() && hashFiles('trivy-secrets.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

      - name: Upload Trivy frontend dependency report to Code Scanning
        if: always() && hashFiles('trivy-frontend-dependencies.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-dependencies.sarif
          category: trivy-frontend-dependencies

      - name: Upload Trivy backend dependency report to Code Scanning
        if: always() && hashFiles('trivy-backend-dependencies.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-dependencies.sarif
          category: trivy-backend-dependencies

      - name: Upload Trivy frontend image report to Code Scanning
        if: always() && hashFiles('trivy-frontend-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-image.sarif
          category: trivy-frontend-image

      - name: Upload Trivy backend image report to Code Scanning
        if: always() && hashFiles('trivy-backend-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-image.sarif
          category: trivy-backend-image

      - name: Summarize and enforce Trivy results
        if: always()
        shell: bash
        env:
          TRIVY_SECRETS_OUTCOME: ${{ steps.trivy_secrets.outcome }}
          TRIVY_FRONTEND_DEPENDENCIES_OUTCOME: ${{ steps.trivy_frontend_dependencies.outcome }}
          TRIVY_BACKEND_DEPENDENCIES_OUTCOME: ${{ steps.trivy_backend_dependencies.outcome }}
          TRIVY_FRONTEND_IMAGE_OUTCOME: ${{ steps.trivy_frontend_image.outcome }}
          TRIVY_BACKEND_IMAGE_OUTCOME: ${{ steps.trivy_backend_image.outcome }}
        run: |
          set -euo pipefail

          scans=(
            "Secrets|${TRIVY_SECRETS_OUTCOME:-skipped}"
            "Dependências do frontend|${TRIVY_FRONTEND_DEPENDENCIES_OUTCOME:-skipped}"
            "Dependências do backend|${TRIVY_BACKEND_DEPENDENCIES_OUTCOME:-skipped}"
            "Imagem do frontend|${TRIVY_FRONTEND_IMAGE_OUTCOME:-skipped}"
            "Imagem do backend|${TRIVY_BACKEND_IMAGE_OUTCOME:-skipped}"
          )
          failed_scans=()

          {
            echo "## Resultado do Trivy"
            echo ""
            echo "| Scan | Resultado |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for scan in "${scans[@]}"; do
            name="${scan%%|*}"
            outcome="${scan#*|}"
            echo "| ${name} | ${outcome} |" >> "${GITHUB_STEP_SUMMARY}"

            if [ "${outcome}" = "failure" ]; then
              failed_scans+=("${name}")
            fi
          done

          if [ "${#failed_scans[@]}" -gt 0 ]; then
            formatted_failures="$(IFS=', '; echo "${failed_scans[*]}")"
            echo "::error title=Trivy bloqueou a execução::Falha nos scans: ${formatted_failures}. Consulte os steps individuais e o artifact trivy-reports."
            echo "Trivy bloqueou a execução nos scans: ${formatted_failures}."
            exit 1
          fi

      - name: Log in to GHCR
        if: inputs.publish_images && (steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        if: inputs.publish_images && steps.changes.outputs.frontend == 'true'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.frontend_tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              docker push "${tag}"
            fi
          done <<< "${IMAGE_TAGS}"

      - name: Push backend image
        if: inputs.publish_images && steps.changes.outputs.backend == 'true'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.backend_tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              docker push "${tag}"
            fi
          done <<< "${IMAGE_TAGS}"
