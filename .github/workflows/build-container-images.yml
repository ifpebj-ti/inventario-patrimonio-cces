name: Build container images

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref, SHA, or tag to build.
        required: true
        type: string
      version_tag:
        description: Immutable application version tag for production images.
        required: false
        default: ""
        type: string
      publish_images:
        description: Push scanned images to GHCR.
        required: false
        default: false
        type: boolean
      force_build_all:
        description: Build both application images regardless of changed files.
        required: false
        default: false
        type: boolean
      frontend_api_url:
        description: NEXT_PUBLIC_API_URL build argument for the frontend image.
        required: false
        default: ""
        type: string
      frontend_google_client_id:
        description: NEXT_PUBLIC_GOOGLE_CLIENT_ID build argument for the frontend image.
        required: false
        default: ""
        type: string
    secrets:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID:
        description: Optional fallback for the frontend Google OAuth client ID.
        required: false
      GOOGLE_OAUTH_CLIENT_ID:
        description: Optional fallback for the frontend Google OAuth client ID.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  container-images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0

      - name: Detect image changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          build_frontend=false
          build_backend=false
          changed_files=""

          if [ "${{ inputs.force_build_all }}" = "true" ] || [ -n "${{ inputs.version_tag }}" ]; then
            build_frontend=true
            build_backend=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build_frontend=true
            build_backend=true
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
              changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
            elif [ -n "${{ github.event.before }}" ] && ! [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
              if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
                changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
              else
                echo "Previous commit ${{ github.event.before }} is unavailable. Building all images."
                build_frontend=true
                build_backend=true
              fi
            else
              changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            fi

            echo "Changed files:"
            echo "${changed_files:-none}"

            if echo "${changed_files}" | grep -Eq '^(frontend/|docker-compose\.yml|\.env\.example|\.github/workflows/(build-container-images|pull-request-container-images)\.yml)'; then
              build_frontend=true
            fi

            if echo "${changed_files}" | grep -Eq '^(backend/|docker-compose\.yml|\.env\.example|\.github/workflows/(build-container-images|pull-request-container-images)\.yml)'; then
              build_backend=true
            fi
          fi

          {
            echo "frontend=${build_frontend}"
            echo "backend=${build_backend}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Container images"
            echo ""
            echo "| Service | Build |"
            echo "| --- | --- |"
            echo "| Frontend | ${build_frontend} |"
            echo "| Backend | ${build_backend} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Skip unchanged images
        if: steps.changes.outputs.frontend != 'true' && steps.changes.outputs.backend != 'true'
        run: echo "No frontend/backend image sources changed."

      - name: Run Trivy secret scan
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          format: table

      - name: Run Trivy dependency scan for frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table

      - name: Run Trivy dependency scan for backend
        if: steps.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table

      - name: Set up Docker Buildx
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Resolve image metadata
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY,,}"
          owner="${repository%%/*}"
          commit_sha="$(git rev-parse HEAD)"

          build_tags() {
            local image="$1"
            local tags_file="$2"
            local local_tag="$3"

            : > "${tags_file}"

            if [ -n "${{ inputs.version_tag }}" ]; then
              printf "%s\n" "${image}:${{ inputs.version_tag }}" >> "${tags_file}"
            else
              printf "%s\n" "${local_tag}" >> "${tags_file}"
            fi
          }

          frontend_image="ghcr.io/${owner}/inventarium-front"
          backend_image="ghcr.io/${owner}/inventarium-back"
          frontend_tags_file="${RUNNER_TEMP}/frontend-tags.txt"
          backend_tags_file="${RUNNER_TEMP}/backend-tags.txt"

          build_tags "${frontend_image}" "${frontend_tags_file}" "inventarium-front:ci"
          build_tags "${backend_image}" "${backend_tags_file}" "inventarium-back:ci"

          {
            echo "frontend_image=${frontend_image}"
            echo "backend_image=${backend_image}"
            echo "frontend_primary_tag=$(head -n 1 "${frontend_tags_file}")"
            echo "backend_primary_tag=$(head -n 1 "${backend_tags_file}")"
            echo "source_url=https://github.com/${GITHUB_REPOSITORY}"
            echo "revision=${commit_sha}"
            echo "frontend_tags<<EOF"
            cat "${frontend_tags_file}"
            echo "EOF"
            echo "backend_tags<<EOF"
            cat "${backend_tags_file}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate frontend build arguments
        if: steps.changes.outputs.frontend == 'true'
        shell: bash
        env:
          FRONTEND_API_URL: ${{ inputs.frontend_api_url || vars.NEXT_PUBLIC_API_URL }}
          FRONTEND_GOOGLE_CLIENT_ID: ${{ inputs.frontend_google_client_id || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || vars.GOOGLE_OAUTH_CLIENT_ID || secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if [ -z "${FRONTEND_API_URL}" ]; then
            echo "Missing frontend_api_url. Configure NEXT_PUBLIC_API_URL as a repository variable."
            exit 1
          fi

          if [ -z "${FRONTEND_GOOGLE_CLIENT_ID}" ]; then
            echo "Missing frontend_google_client_id. Configure NEXT_PUBLIC_GOOGLE_CLIENT_ID or GOOGLE_OAUTH_CLIENT_ID as a repository variable or secret."
            exit 1
          fi

      - name: Build frontend image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.frontend_tags }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ inputs.frontend_google_client_id || vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || vars.GOOGLE_OAUTH_CLIENT_ID || secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
            NEXT_PUBLIC_API_URL=${{ inputs.frontend_api_url || vars.NEXT_PUBLIC_API_URL }}
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.source_url }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ inputs.version_tag }}

      - name: Scan frontend image
        if: steps.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.frontend_primary_tag }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table

      - name: Build backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.backend_tags }}
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.source_url }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ inputs.version_tag }}

      - name: Scan backend image
        if: steps.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.backend_primary_tag }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table

      - name: Log in to GHCR
        if: inputs.publish_images && (steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        if: inputs.publish_images && steps.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              docker push "${tag}"
            fi
          done <<< "${{ steps.meta.outputs.frontend_tags }}"

      - name: Push backend image
        if: inputs.publish_images && steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              docker push "${tag}"
            fi
          done <<< "${{ steps.meta.outputs.backend_tags }}"
